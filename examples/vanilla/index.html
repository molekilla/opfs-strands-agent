<!doctype html>
<!--
  Vanilla JS — OPFS Strands Agent demo
  ─────────────────────────────────────
  A zero-framework demo that uses the Strands Agent with opfs-worker
  directly from plain JavaScript (ESM), bundled with Vite.

  Setup
  ─────
  1. npm install @strands-agents/sdk opfs-worker zod
  2. npm install --save-dev vite
  3. Add "dev": "vite" to package.json scripts
  4. Set AWS credentials (for default Bedrock) OR edit app.js to use OpenAI
  5. npm run dev  →  open http://localhost:5173/examples/vanilla/
-->
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>OPFS Strands Agent — Vanilla JS</title>
    <style>
      *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

      body {
        font-family: 'Segoe UI', system-ui, sans-serif;
        background: #0f1117;
        color: #e2e8f0;
        min-height: 100vh;
        display: flex;
        flex-direction: column;
        align-items: center;
        padding: 2rem 1rem;
        gap: 1.5rem;
      }

      header { text-align: center; }

      h1 {
        font-size: 1.75rem;
        font-weight: 700;
        background: linear-gradient(135deg, #6366f1, #8b5cf6);
        -webkit-background-clip: text;
        -webkit-text-fill-color: transparent;
        background-clip: text;
      }

      .subtitle { color: #94a3b8; font-size: 0.9rem; margin-top: 0.4rem; }

      #status {
        display: inline-block;
        padding: 3px 12px;
        border-radius: 999px;
        color: #fff;
        font-size: 0.75rem;
        font-weight: 600;
        text-transform: capitalize;
        background: #64748b;
        transition: background 0.3s;
      }

      #status.ready         { background: #22c55e; }
      #status.busy          { background: #6366f1; }
      #status.initialising  { background: #f59e0b; }
      #status.error         { background: #ef4444; }

      #error-banner {
        display: none;
        width: 100%;
        max-width: 760px;
        background: #450a0a;
        border: 1px solid #ef4444;
        border-radius: 0.5rem;
        padding: 0.75rem 1rem;
        color: #fca5a5;
        font-size: 0.85rem;
      }

      .output-card {
        width: 100%;
        max-width: 760px;
        background: #1e2130;
        border: 1px solid #2d3148;
        border-radius: 0.75rem;
        overflow: hidden;
      }

      .output-header {
        background: #252840;
        padding: 0.6rem 1rem;
        font-size: 0.78rem;
        color: #6366f1;
        font-weight: 600;
        letter-spacing: 0.05em;
        text-transform: uppercase;
        border-bottom: 1px solid #2d3148;
        display: flex;
        justify-content: space-between;
        align-items: center;
      }

      #clear-btn {
        background: none;
        border: 1px solid #4b5180;
        border-radius: 0.25rem;
        color: #94a3b8;
        cursor: pointer;
        font-size: 0.72rem;
        padding: 2px 8px;
      }

      #output {
        margin: 0;
        padding: 1rem;
        white-space: pre-wrap;
        font-family: 'Cascadia Code', 'Fira Code', 'Courier New', monospace;
        font-size: 0.82rem;
        line-height: 1.7;
        color: #a5f3fc;
        min-height: 200px;
        max-height: 50vh;
        overflow-y: auto;
      }

      .input-row {
        width: 100%;
        max-width: 760px;
        display: flex;
        gap: 0.5rem;
      }

      #prompt {
        flex: 1;
        background: #1e2130;
        border: 1px solid #2d3148;
        border-radius: 0.5rem;
        color: #e2e8f0;
        font-family: inherit;
        font-size: 0.9rem;
        padding: 0.6rem 0.9rem;
        resize: vertical;
        outline: none;
      }

      #run-btn {
        background: linear-gradient(135deg, #6366f1, #8b5cf6);
        border: none;
        border-radius: 0.5rem;
        color: #fff;
        font-weight: 600;
        font-size: 0.9rem;
        padding: 0 1.25rem;
        cursor: pointer;
        opacity: 0.5;
        transition: opacity 0.2s;
      }

      #run-btn.active { opacity: 1; cursor: pointer; }

      .hint { color: #475569; font-size: 0.78rem; }
      kbd   { background: #1e2130; padding: 1px 5px; border-radius: 3px; }
    </style>
  </head>
  <body>
    <header>
      <h1>OPFS File Agent</h1>
      <p class="subtitle">
        Powered by
        <a href="https://www.npmjs.com/package/@strands-agents/sdk"
           target="_blank" rel="noopener noreferrer" style="color:#818cf8">
          Strands Agents
        </a>
        +
        <a href="https://www.npmjs.com/package/opfs-worker"
           target="_blank" rel="noopener noreferrer" style="color:#818cf8">
          opfs-worker
        </a>
        (Vanilla&nbsp;JS)
      </p>
    </header>

    <span id="status">initialising</span>

    <div id="error-banner"></div>

    <div class="output-card">
      <div class="output-header">
        <span>Agent Output</span>
        <button id="clear-btn">Clear</button>
      </div>
      <pre id="output">Initialising agent…</pre>
    </div>

    <div class="input-row">
      <textarea
        id="prompt"
        rows="2"
        disabled
        placeholder='e.g. "Write a file at /hello.txt with content Hello!"'
      ></textarea>
      <button id="run-btn" disabled>Run</button>
    </div>

    <p class="hint">
      Press <kbd>Enter</kbd> to run &nbsp;·&nbsp;
      <kbd>Shift+Enter</kbd> for newline
    </p>

    <script type="module" src="./app.js"></script>
  </body>
</html>
