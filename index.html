<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>OPFS Strands Agent</title>
    <style>
      * {
        box-sizing: border-box;
        margin: 0;
        padding: 0;
      }

      body {
        font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        background: #0f1117;
        color: #e2e8f0;
        min-height: 100vh;
        display: flex;
        flex-direction: column;
        align-items: center;
        padding: 2rem 1rem;
      }

      header {
        text-align: center;
        margin-bottom: 2rem;
      }

      header h1 {
        font-size: 2rem;
        font-weight: 700;
        background: linear-gradient(135deg, #6366f1, #8b5cf6);
        -webkit-background-clip: text;
        -webkit-text-fill-color: transparent;
        background-clip: text;
      }

      header p {
        color: #94a3b8;
        margin-top: 0.5rem;
        font-size: 0.95rem;
      }

      #output-container {
        width: 100%;
        max-width: 900px;
        background: #1e2130;
        border: 1px solid #2d3148;
        border-radius: 0.75rem;
        overflow: hidden;
      }

      #output-header {
        background: #252840;
        padding: 0.75rem 1.25rem;
        font-size: 0.85rem;
        color: #6366f1;
        font-weight: 600;
        letter-spacing: 0.05em;
        text-transform: uppercase;
        border-bottom: 1px solid #2d3148;
      }

      #output {
        padding: 1.25rem;
        white-space: pre-wrap;
        font-family: 'Cascadia Code', 'Fira Code', 'Courier New', monospace;
        font-size: 0.85rem;
        line-height: 1.7;
        color: #a5f3fc;
        min-height: 300px;
        max-height: 70vh;
        overflow-y: auto;
      }
    </style>
  </head>
  <body>
    <header>
      <h1>OPFS Strands Agent</h1>
      <p>
        A Strands Agent boilerplate that uses
        <a
          href="https://www.npmjs.com/package/opfs-worker"
          target="_blank"
          rel="noopener noreferrer"
          style="color: #818cf8"
          >opfs-worker</a
        >
        for browser-based file operations
      </p>
    </header>

    <div id="output-container">
      <div id="output-header">Agent Output</div>
      <pre id="output">Loading…</pre>
    </div>

    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
